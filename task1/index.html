    <h1 class="page-title">Task 1. Geometric composition (CSS Grid)</h1>
    <p class="page-lede">
      A single 6×6 CSS Grid. Every colored panel is placed with
      <code>grid-column</code> / <code>grid-row</code> line numbers; the black
      lines are the grid's own <code>gap</code>, not borders or margins.
    </p>

    <div class="composition" role="img" aria-label="Mondrian-style geometric composition">
      <div class="block blue"></div>
      <div class="block gray-top"></div>
      <div class="block yellow"></div>
      <div class="block gray-right"></div>
      <div class="block red"></div>
      <div class="block black"></div>
    </div>
